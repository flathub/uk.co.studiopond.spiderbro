app-id: uk.co.studiopond.spiderbro
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: spiderbro_linux
finish-args:
  - --socket=pulseaudio
  - --socket=x11
  - --device=dri
  - --share=ipc
modules:
  - shared-modules/glu/glu-9.json
  - name: Spiderbro
    buildsystem: simple
    build-commands:
      - install -Dm755 spiderbro_linux -t /app/bin/
      - install -Dm755 polybius_linux -t /app/bin/
      - unzip -o data.zip -d /app/bin
      - unzip -o polydata.zip -d /app/bin
      - install -D uk.co.studiopond.spiderbro.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -D uk.co.studiopond.spiderbro.desktop -t /app/share/applications/
      - install -D uk.co.studiopond.spiderbro.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/pforpond/Spiderbro-Flatpak.git
        commit: 61da77a
